[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hqml-topological-qaoa"
version = "2.0.0"
description = "Collision-aware audit of QAOA parameter transfer on authenticated Stanford Gset sources"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24,<2", "matplotlib>=3.7,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
topological-qaoa-reproduce = "hqml_topological_qaoa.audit:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["hqml_topological_qaoa*"]

[tool.setuptools.package-data]
"hqml_topological_qaoa" = ["data/source/*", "results/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
